<!DOCTYPE html>
<html lang="en">
<head>
	<title>Dance Designer — Create Account</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
<!--===============================================================================================-->
  <link rel="shortcut icon" type="image/png" href="static/files/dancer.png"/>
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/font-awesome.css') }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/icon-font.min.css') }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/animate.css') }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/hamburgers.min.css') }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/animsition.min.css') }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/select2.min.css') }}"
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/daterangepicker.css') }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/util.css') }}">
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/main.css') }}">
<!--===============================================================================================-->
</head>
<body>

	<div class="limiter">
		<div class="container-login100" style="background-image: url('static/files/bg-01.jpg');">
			<div class="wrap-login100 p-l-110 p-r-110 p-t-62 p-b-33">
				<form class="login100-form validate-form flex-sb flex-w" method="POST" action="/register">
					<span class="login100-form-title p-b-53">
						Create Account
					</span>

					{% if error %}
					<div class="w-full text-center p-b-20">
						<span class="txt2" style="color: #c80000;">{{ error }}</span>
					</div>
					{% endif %}

					<div class="p-t-10 p-b-9">
						<span class="txt1">Name</span>
					</div>
					<div class="wrap-input100 validate-input m-b-16" data-validate="Name is required">
						<input class="input100" type="text" name="name" placeholder="Your name" required>
						<span class="focus-input100"></span>
					</div>

					<div class="p-t-10 p-b-9">
						<span class="txt1">Email</span>
					</div>
					<div class="wrap-input100 validate-input m-b-16" data-validate="Valid email is required">
						<input class="input100" type="email" name="email" placeholder="you@example.com" required>
						<span class="focus-input100"></span>
					</div>

					<div class="p-t-10 p-b-9">
						<span class="txt1">Password</span>
					</div>
					<div class="wrap-input100 validate-input m-b-16" data-validate="At least 8 characters">
						<input class="input100" type="password" name="password" placeholder="At least 8 characters" required minlength="8">
						<span class="focus-input100"></span>
					</div>

					<div class="container-login100-form-btn m-t-17">
						<button class="login100-form-btn" type="submit">
							Sign up
						</button>
					</div>

					<div class="w-full text-center p-t-30">
						<span class="txt2">
							Already have an account?
						</span>

						<a href="/" class="txt2 bo1">
							Sign in
						</a>
					</div>
				</form>
			</div>
		</div>
	</div>

	<div id="dropDownSelect1"></div>

<!--===============================================================================================-->
  <script type="text/javascript"
       src="{{ url_for('static', filename='js/jquery-3.2.1.min.js') }}"></script>
<!--===============================================================================================-->
	<script src="{{ url_for('static', filename='js/animsition.min.js') }}"></script>
<!--===============================================================================================-->
	<script src="{{ url_for('static', filename='js/popper.js') }}"></script>
	<script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>
<!--===============================================================================================-->
	<script src="{{ url_for('static', filename='js/select2.min.js') }}"></script>
<!--===============================================================================================-->
	<script src="{{ url_for('static', filename='js/moment.min.js') }}"></script>
	<script src="{{ url_for('static', filename='js/daterangepicker.js') }}"></script>
<!--===============================================================================================-->
	<script src="{{ url_for('static', filename='js/countdowntime.js') }}"></script>
<!--===============================================================================================-->
	<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
